n for reservation of seats in any Panchayat or offices of Chairpersons in the Panchayats at any level in favour of backward class of citizens."]],["243E","Duration of Panchayats, etc","IX",["(1) Every Panchayat, unless sooner dissolved under any law for the time being in force, shall continue for five years from the date appointed for its first meeting and no longer.","","(2) No amendment of any law for the time being in force shall have the effect of causing dissolution of a Panchayat at any level, which is functioning immediately before such amendment, till the expiration of its duration specified in clause (1).","","(3) An election to constitute a Panchayat shall be completed —","","(a) before the expiry of its duration specified in clause (1);","","(b) before the expiration of a period of six months from the date of its dissolution:","","Provided that where the remainder of the period for which the dissolved Panchayat would have continued is less than six months, it shall not be necessary to hold any election under this clause for constituting the Panchayat for such period.","","(4) A Panchayat constituted upon the dissolution of a Panchayat before the expiration of its duration shall continue only for the remainder of the period for which the dissolved Panchayat would have continued under clause (1) had it not been so dissolved."]],["243F","Disqualifications for membership","IX",["(1) A person shall be disqualified for being chosen as, and for being, a member of a Panchayat —","","(a) if he is so disqualified by or under any law for the time being in force for the purposes of elections to the Legislature of the State concerned: Provided that no person shall be disqualified on the ground that he is less than twenty-five years of age, if he has attained the age of twenty-one years;","","(b) if he is so disqualified by or under any law made by the Legislature of the State.","","(2) If any question arises as to whether a member of a Panchayat has become subject to any of the disqualifications mentioned in clause (1), the question shall be referred for the decision of such authority and in such manner as the Legislature of a State may, by law, provide."]],["243G","Powers, authority and responsibilities of Panchayats","IX",["Subject to the provisions of this Constitution, the Legislature of a State may, by law, endow the Panchayats with such powers and authority as may be necessary to enable them to function as institutions of self-government and such law may contain provisions for the devolution of powers and responsibilities upon Panchayats at the appropriate level, subject to such conditions as may be specified therein, with respect to —","","(a) the preparation of plans for economic development and social justice;","","(b) the implementation of schemes for economic development and social justice as may be entrusted to them including those in relation to the matters listed in the Eleventh Schedule."]],["243H","Powers to impose taxes by, and Funds of, the Panchayats","IX",["The Legislature of a State may, by law, —","","(a) authorise a Panchayat to levy, collect and appropriate such taxes, duties, tolls and fees in accordance with such procedure and subject to such limits;","","(b) assign to a Panchayat such taxes, duties, tolls and fees levied and collected by the State Government for such purposes and subject to such conditions and limits;","","(c) provide for making such grants-in-aid to the Panchayats from the Consolidated Fund of the State; and","","(d) provide for constitution of such Funds for crediting all moneys received, respectively, by or on behalf of the Panchayats and also for the withdrawal of such moneys therefrom,","","as may be specified in the law."]],["243I","Constitution of Finance Commission to review financial position","IX",["(1) The Governor of a State shall, as soon as may be within one year from the commencement of the Constitution (Seventy-third Amendment) Act, 1992, and thereafter at the expiration of every fifth year, constitute a Finance Commission to review the financial position of the Panchayats and to make recommendations to the Governor as to —","","(a) the principles which should govern —","","(i) the distribution between the State and the Panchayats of the net proceeds of the taxes, duties, tolls and fees leviable by the State, which may be divided between them under this Part and the allocation between the Panchayats at all levels of their respective shares of such proceeds;","","(ii) the determination of the taxes, duties, tolls and fees which may be assigned to, or appropriated by, the Panchayats; (iii) the grants-in-aid to the Panchayats from the Consolidated Fund of the State;","","(b) the measures needed to improve the financial position of the Panchayats;","","(c) any other matter referred to the Finance Commission by the Governor in the interests of sound finance of the Panchayats.","","(2) The Legislature of a State may, by law, provide for the composition of the Commission, the qualifications which shall be requisite for appointment as members thereof and the manner in which they shall be selected.","","(3) The Commission shall determine their procedure and shall have such powers in the performance of their functions as the Legislature of the State may, by law, confer on them.","","(4) The Governor shall cause every recommendation made by the Commission under this article together with an explanatory memorandum as to the action taken thereon to be laid before the Legislature of the State."]],["243J","Audit of accounts of Panchayats","IX",["The Legislature of a State may, by law, make provisions with respect to the maintenance of accounts by the Panchayats and the auditing of such accounts."]],["243K","Elections to the Panchayats","IX",["(1) The superintendence, direction and control of the preparation of electoral rolls for, and the conduct of, all elections to the Panchayats shall be vested in a State Election Commission consisting of a State Election Commissioner to be appointed by the Governor.","","(2) Subject to the provisions of any law made by the Legislature of a State, the conditions of service and tenure of office of the State Election Commissioner shall be such as the Governor may by rule determine:","","Provided that the State Election Commissioner shall not be removed from his office except in like manner and on the like grounds as a Judge of a High Court and the conditions of service of the State Election Commissioner shall not be varied to his disadvantage after his appointment.","","(3) The Governor of a State shall, when so requested by the State Election Commission, make available to the State Election Commission such staff as may be necessary for the discharge of the functions conferred on the State Election Commission by clause (1).","","(4) Subject to the provisions of this Constitution, the Legislature of a State may, by law, make provision with respect to all matters relating to, or in connection with, elections to the Panchayats."]],["243L","Application to Union territories","IX",["The provisions of this Part shall apply to the Union territories and shall, in their application to a Union territory, have effect as if the references to the Governor of a State were references to the Administrator of the Union territory appointed under article 239 and references to the Legislature or the Legislative Assembly of a State were references, in relation to a Union territory having a Legislative Assembly, to that Legislative Assembly:","","Provided that the President may, by public notification, direct that the provisions of this Part shall apply to any Union territory or part thereof subject to such exceptions and modifications as he may specify in the notification."]],["243M","Part not to apply to certain areas","IX",["(1) Nothing in this Part shall apply to the Scheduled Areas referred to in clause (1), and the tribal areas referred to in clause (2), of article 244.","","(2) Nothing in this Part shall apply to —","","(a) the States of Nagaland, Meghalaya and Mizoram;","","(b) the hill areas in the State of Manipur for which District Councils exist under any law for the time being in force.","","(3) Nothing in this Part —","","(a) relating to Panchayats at the district level shall apply to the hill areas of the District of Darjeeling in the State of West Bengal for which Darjeeling Gorkha Hill Council exists under any law for the time being in force;","","(b) shall be construed to affect the functions and powers of the Darjeeling Gorkha Hill Council constituted under such law.","","(3A) Nothing in article 243D, relating to reservation of seats for the Scheduled Castes, shall apply to the State of Arunachal Pradesh.","","(4) Notwithstanding anything in this Constitution, —","","(a) the Legislature of a State referred to in subclause (a) of clause (2) may, by law, extend this part to that State, except the areas, if any, referred to in clause (1), if the Legislative Assembly of that State passes a resolution to that effect by a majority of the total membership of that House and by a majority of not less than two-thirds of the members of that House present and voting;","","(b) Parliament may, by law, extend the provisions of this Part to the Scheduled Areas and the tribal areas referred to in clause (1) subject to such exceptions and modifications as may be specified in such law, and no such law shall be deemed to be an amendment of this Constitution for the purposes of article 368."]],["243N","Continuance of existing laws and Panchayats","IX",["Notwithstanding anything in this Part, any provision of any law relating to Panchayats in force in a State immediately before the commencement of the Constitution (Seventy-third Amendment) Act, 1992, which is inconsistent with the provisions of this Part, shall continue to be in force until amended or repealed by a competent Legislature or other competent authority or until the expiration of one year from such commencement, whichever is earlier:","","Provided that all the Panchayats existing immediately before such commencement shall continue till the expiration of their duration, unless sooner dissolved by a resolution passed to that effect by the Legislative Assembly of that State or, in the case of a State having a Legislative Council, by each House of the Legislature of that State."]],["243O","Bar to interference by courts in electoral matters","IX",["Notwithstanding anything in this Constitution, —","","(a) the validity of any law relating to the delimitation of constituencies or the allotment of seats to such constituencies, made or purporting to be made under article 243K, shall not be called in question in any court;","","(b) no election to any Panchayat shall be called in question except by an election petition presented to such authority and in such manner as is provided for by or under any law made by the Legislature of a State."]],["243P","Definitions","IXA",["In this Part, unless the context otherwise requires, —","","(a) “Committee” means a Committee constituted under article 243S;","","(b) “district” means a district in a State;","","(c) “Metropolitan area” means an area having a population of ten lakhs or more, comprised in one or more districts and consisting of two or more Municipalities or Panchayats or other contiguous areas, specified by the Governor by public notification to be a Metropolitan area for the purposes of this Part;","","(d) “Municipal area” means the territorial area of a Municipality as is notified by the Governor;","","(e) “Municipality” means an institution of selfgovernment constituted under article 243Q;","","(f) “Panchayat” means a Panchayat constituted under article 243B;","","(g) “population” means the population as ascertained at the last preceding census of which the relevant figures have been published."]],["243Q","Constitution of Municipalities","IXA",["(1) There shall be constituted in every State, —","","(a) a Nagar Panchayat (by whatever name called) for a transitional area, that is to say, an area in transition from a rural area to an urban area;","","(b) a Municipal Council for a smaller urban area; and","","(c) a Municipal Corporation for a larger urban area, in accordance with the provisions of this Part:","","Provided that a Municipality under this clause may not be constituted in such urban area or part thereof as the Governor may, having regard to the size of the area and the municipal services being provided or proposed to be provided by an industrial establishment in that area and such other factors as he may deem fit, by public notification, specify to be an industrial township.","","(2) In this article, “a transitional area”, “a smaller urban area” or “a larger urban area” means such area as the Governor may, having regard to the population of the area, the density of the population therein, the revenue generated for local administration, the percentage of employment in non-agricultural activities, the economic importance or such other factors as he may deem fit, specify by public notification for the purposes of this Part"]],["243R","Composition of Municipalities","IXA",["(1) Save as provided in clause (2), all the seats in a Municipality shall be filled by persons chosen by direct election from the territorial constituencies in the Municipal area and for this purpose each Municipal area shall be divided into territorial constituencies to be known as wards.","","(2) The Legislature of a State may, by law, provide —","","(a) for the representation in a Municipality of —","","(i) persons having special knowledge or experience in Municipal administration;","","(ii) the members of the House of the People and the members of the Legislative Assembly of the State representing constituencies which comprise wholly or partly the Municipal area;","","(iii) the members of the Council of States and the members of the Legislative Council of the State registered as electors within the Municipal area;","","(iv) the Chairpersons of the Committees constituted under clause (5) of article 243S:","","Provided that the persons referred to in paragraph (i) shall not have the right to vote in the meetings of the Municipality;","","(b) the manner of election of the Chairperson of a Municipality"]],["243S","Constitution and composition of Wards Committees, etc","IXA",["(1) There shall be constituted Wards Committees, consisting of one or more wards, within the territorial area of a Municipality having a population of three lakhs or more.","","(2) The Legislature of a State may, by law, make provision with respect to —","","(a) the composition and the territorial area of a Wards Committee;","","(b) the manner in which the seats in a Wards Committee shall be filled.","","(3) A member of a Municipality representing a ward within the territorial area of the Wards Committee shall be a member of that Committee.","","(4) Where a Wards Committee consists of —","","(a) one ward, the member representing that ward in the Municipality; or","","(b) two or more wards, one of the members representing such wards in the Municipality elected by the members of the Wards Committee, shall be the Chairperson of that Committee.","","(5) Nothing in this article shall be deemed to prevent the Legislature of a State from making any provision for the constitution of Committees in addition to the Wards Committees."]],["243T","Reservation of seats","IXA",["(1) Seats shall be reserved for the Scheduled Castes and the Scheduled Tribes in every Municipality and the number of seats so reserved shall bear, as nearly as may be, the same proportion to the total number of seats to be filled by direct election in that Municipality as the population of the Scheduled Castes in the Municipal area or of the Scheduled Tribes in the Municipal area bears to the total population of that area and such seats may be allotted by rotation to different constituencies in a Municipality.","","(2) Not less than one-third of the total number of seats reserved under clause (1) shall be reserved for women belonging to the Scheduled Castes or, as the case may be, the Scheduled Tribes.","","(3) Not less than one-third (including the number of seats reserved for women belonging to the Scheduled Castes and the Scheduled Tribes) of the total number of seats to be filled by direct election in every Municipality shall be reserved for women and such seats may be allotted by rotation to different constituencies in a Municipality.","","(4) The offices of Chairpersons in the Municipalities shall be reserved for the Scheduled Castes, the Scheduled Tribes and women in such manner as the Legislature of a State may, by law, provide.","","(5) The reservation of seats under clauses (1) and (2) and the reservation of offices of Chairpersons (other than the reservation for women) under clause (4) shall cease to have effect on the expiration of the period specified in article 334.","","(6) Nothing in this Part shall prevent the Legislature of a State from making any provision for reservation of seats in any Municipality or offices of Chairpersons in the Municipalities in favour of backward class of citizens."]],["243U","Duration of Municipalities, etc","IXA",["(1) Every Municipality, unless sooner dissolved under any law for the time being in force, shall continue for five years from the date appointed for its first meeting and no longer:","","Provided that a Municipality shall be given a reasonable opportunity of being heard before its dissolution.","","(2) No amendment of any law for the time being in force shall have the effect of causing dissolution of a Municipality at any level, which is functioning immediately before such amendment, till the expiration of its duration specified in clause (1).","","(3) An election to constitute a Municipality shall be completed, —","","(a) before the expiry of its duration specified in clause (1);","","(b) before the expiration of a period of six months from the date of its dissolution:","","Provided that where the remainder of the period for which the dissolved Municipality would have continued is less than six months, it shall not be necessary to hold any election under this clause for constituting the Municipality for such period.","","(4) A Municipality constituted upon the dissolution of a Municipality before the expiration of its duration shall continue only for the remainder of the period for which the dissolved Municipality would have continued under clause (1) had it not been so dissolved."]],["243V","Disqualifications for membership","IXA",["(1) A person shall be disqualified for being chosen as, and for being, a member of a Municipality —","","(a) if he is so disqualified by or under any law for the time being in force for the purposes of elections to the Legislature of the State concerned:","","Provided that no person shall be disqualified on the ground that he is less than twenty-five years of age, if he has attained the age of twenty-one years;","","(b) if he is so disqualified by or under any law made by the Legislature of the State.","","(2) If any question arises as to whether a member of a Municipality has become subject to any of the disqualifications mentioned in clause (1), the question shall be referred for the decision of such authority and in such manner as the Legislature of a State may, by law, provide."]],["243W","Powers, authority and responsibilities of Municipalities, etc","IXA",["Subject to the provisions of this Constitution, the Legislature of a State may, by law, endow —","","(a) the Municipalities with such powers and authority as may be necessary to enable them to function as institutions of self-government and such law may contain provisions for the devolution of powers and responsibilities upon Municipalities, subject to such conditions as may be specified therein, with respect to —","","(i) the preparation of plans for economic development and social justice;","","(ii) the performance of functions and the implementation of schemes as may be entrusted to them including those in relation to the matters listed in the Twelfth Schedule;","","(b) the Committees with such powers and authority as may be necessary to enable them to carry out the responsibilities conferred upon them including those in relation to the matters listed in the Twelfth Schedule."]],["243X","Power to impose taxes by, and Funds of, the Municipalities","IXA",["The Legislature of a State may, by law, —","","(a) authorise a Municipality to levy, collect and appropriate such taxes, duties, tolls and fees in accordance with such procedure and subject to such limits;","","(b) assign to a Municipality such taxes, duties, tolls and fees levied and collected by the State Government for such purposes and subject to such conditions and limits;","","(c) provide for making such grants-in-aid to the Municipalities from the Consolidated Fund of the State; and","","(d) provide for constitution of such Funds for crediting all moneys received, respectively, by or on behalf of the Municipalities and also for the withdrawal of such moneys therefrom,","","as may be specified in the law."]],["243Y","Finance Commission","IXA",["(1) The Finance Commission constituted under article 243-I shall also review the financial position of the Municipalities and make recommendations to the Governor as to —","","(a) the principles which should govern—","(i) the distribution between the State and the Municipalities of the net proceeds of the taxes, duties, tolls and fees leviable by the State, which may be divided between them under this Part and the allocation between the Municipalities at all levels of their respective shares of such proceeds;","(ii) the determination of the taxes, duties, tolls and fees which may be assigned to, or appropriated by, the Municipalities;","(iii) the grants-in-aid to the Municipalities from the Consolidated Fund of the State;","","(b) the measures needed to improve the financial position of the Municipalities;","","(c) any other matter referred to the Finance Commission by the Governor in the interests of sound finance of the Municipalities.","","(2) The Governor shall cause every recommendation made by the Commission under this article together with an explanatory memorandum as to the action taken thereon to be laid before the Legislature of the State."]],["243Z","Audit of accounts of Municipalities","IXA",["The Legislature of a State may, by law, make provisions with respect to the maintenance of accounts by the Municipalities and the auditing of such accounts."]],["243ZA","Elections to the Municipalities","IXA",["(1) The superintendence, direction and control of the preparation of electoral rolls for, and the conduct of, all elections to the Municipalities shall be vested in the State Election Commission referred to in article 243K.","","(2) Subject to the provisions of this Constitution, the Legislature of a State may, by law, make provision with respect to all matters relating to, or in connection with, elections to the Municipalities."]],["243ZB","Application to Union territories","IXA",["The provisions of this Part shall apply to the Union territories and shall, in their application to a Union territory, have effect as if the references to the Governor of a State were references to the Administrator of the Union territory appointed under article 239 and references to the Legislature or the Legislative Assembly of a State were references in relation to a Union territory having a Legislative Assembly, to that Legislative Assembly:","","Provided that the President may, by public notification, direct that the provisions of this Part shall apply to any Union territory or part thereof subject to such exceptions and modifications as he may specify in the notification."]],["243ZC","Part not to apply to certain areas","IXA",["(1) Nothing in this Part shall apply to the Scheduled Areas referred to in clause (1), and the tribal areas referred to in clause (2), of article 244.","","(2) Nothing in this Part shall be construed to affect the functions and powers of the Darjeeling Gorkha Hill Council constituted under any law for the time being in force for the hill areas of the district of Darjeeling in the State of West Bengal.","","(3) Notwithstanding anything in this Constitution, Parliament may, by law, extend the provisions of this Part to the Scheduled Areas and the tribal areas referred to in clause (1) subject to such exceptions and modifications as may be specified in such law, and no such law shall be deemed to be an amendment of this Constitution for the purposes of article 368."]],["243ZD","Committee for district planning","IXA",["(1) There shall be constituted in every State at the district level a District Planning Committee to consolidate the plans prepared by the Panchayats and the Municipalities in the district and to prepare a draft development plan for the district as a whole.","","(2) The Legislature of a State may, by law, make provision with respect to —","","(a) the composition of the District Planning Committees;","","(b) the manner in which the seats in such Committees shall be filled:","","Provided that not less than four-fifths of the total number of members of such Committee shall be elected by, and from amongst, the elected members of the Panchayat at the district level and of the Municipalities in the district in proportion to the ratio between the population of the rural areas and of the urban areas in the district;","","(c) the functions relating to district planning which may be assigned to such Committees;","","(d) the manner in which the Chairpersons of such Committees shall be chosen.","","(3) Every District Planning Committee shall, in preparing the draft development plan, —","","(a) have regard to —","","(i) matters of common interest between the Panchayats and the Municipalities including spatial planning, sharing of water and other physical and natural resources, the integrated development of infrastructure and environmental conservation;","","(ii) the extent and type of available resources whether financial or otherwise;","","(b) consult such institutions and organisations as the Governor may, by order, specify.","","(4) The Chairperson of every District Planning Committee shall forward the development plan, as recommended by such Committee, to the Government of the State."]],["243ZE","Committee for Metropolitan planning","IXA",["(1) There shall be constituted in every Metropolitan area a Metropolitan Planning Committee to prepare a draft development plan for the Metropolitan area as a whole.","","(2) The Legislature of a State may, by law, make provision with respect to —","","(a) the composition of the Metropolitan Planning Committees;","","(b) the manner in which the seats in such Committees shall be filled:","","Provided that not less than two-thirds of the members of such Committee shall be elected by, and from amongst, the elected members of the Municipalities and Chairpersons of the Panchayats in the Metropolitan area in proportion to the ratio between the population of the Municipalities and of the Panchayats in that area;","","(c) the representation in such Committees of the Government of India and the Government of the State and of such organisations and Institutions as may be deemed necessary for carrying out the functions assigned to such Committees;","","(d) the functions relating to planning and coordination for the Metropolitan area which may be assigned to such Committees;","","(e) the manner in which the Chairpersons of such Committees shall be chosen.","","(3) Every Metropolitan Planning Committee shall, in preparing the draft development plan, —","","(a) have regard to —","","(i) the plans prepared by the Municipalities and the Panchayats in the Metropolitan area;","","(ii) matters of common interest between the Municipalities and the Panchayats, including co-ordinated spatial planning of the area, sharing of water and other physical and natural resources, the integrated development of infrastructure and environmental conservation;","","(iii) the overall objectives and priorities set by the Government of India and the Government of the State;","","(iv) the extent and nature of investments likely to be made in the Metropolitan area by agencies of the Government of India and of the Government of the State and other available resources whether financial or otherwise;","","(b) consult such institutions and organisations as the Governor may, by order, specify.","","(4) The Chairperson of every Metropolitan Planning Committee shall forward the development plan, as recommended by such Committee, to the Government of the State."]],["243ZF","Continuance of existing laws and Municipalities","IXA",["Notwithstanding anything in this Part, any provision of any law relating to Municipalities in force in a State immediately before the commencement of the Constitution (Seventy-fourth Amendment) Act, 1992, which is inconsistent with the provisions of this Part, shall continue to be in force until amended or repealed by a competent Legislature or other competent authority or until the expiration of one year from such commencement, whichever is earlier:","","Provided that all the Municipalities existing immediately before such commencement shall continue till the expiration of their duration, unless sooner dissolved by a resolution passed to that effect by the Legislative Assembly of that State or, in the case of a State having a Legislative Council, by each House of the Legislature of that State."]],["243ZG","Bar to interference by courts in electoral matters","IXA",["Notwithstanding anything in this Constitution, —","","(a) the validity of any law relating to the delimitation of constituencies or the allotment of seats to such constituencies, made or purporting to be made under article 243ZA shall not be called in question in any court;","","(b) no election to any Municipality shall be called in question except by an election petition presented to such authority and in such manner as is provided for by or under any law made by the Legislature of a State."]],["243ZH","Definitions","IXB",["In this Part, unless the context otherwise requires,—","","(a) \"authorised person\" means a person referred to as such in article 243ZQ;","","(b) \"board\" means the board of directors or the governing body of a co-operative society, by whatever name called, to which the direction and control of the management of the affairs of a society is entrusted to;","","(c) \"co-operative society\" means a society registered or deemed to be registered under any law relating to co-operative societies for the time being in force in any State;","","(d) \"multi-State co-operative society\" means a society with objects not confined to one State and registered or deemed to be registered under any law for the time being in force relating to such cooperatives;","","(e) \"Office bearer\" means a President, Vice-President, Chairperson, Vice-Chairperson, Secretary or Treasurer, of a co-operative society and includes any other person to be elected by the board of any cooperative society;","","(f) \"Registrar\" means the Central Registrar appointed by the Central Government in relation to the multi-State co-operative societies and the Registrar for co-operative societies appointed by the State Government under the law made by the Legislature of a State in relation to co-operative societies;","","(g) \"State Act\" means any law made by the Legislature of a State;","","(h) \"State level co-operative society\" means a co-operative society having its area of operation extending to the whole of a State and defined as such in any law made by the Legislature of a State."]],["243ZI","Incorporation of co-operative societies","IXB",["Subject to the provisions of this Part, the Legislature of a State may, by law, make provisions with respect to the incorporation, regulation and winding up of co-operative societies based on the principles of voluntary formation, democratic membercontrol, member-economic participation and autonomous functioning."]],["243ZJ","Number and term of members of board and its office bearers","IXB",["(1) The board shall consist of such number of directors as may be provided by the Legislature of a State, by law:","","Provided that the maximum number of directors of a co-operative society shall not exceed twenty-one:","","Provided further that the Legislature of a State shall, by law, provide for the reservation of one seat for the Scheduled Castes or the Scheduled Tribes and two seats for women on board of every co-operative society consisting of individuals as members and having members from such class of category of persons.","","(2) The term of office of elected members of the board and its office bearers shall be five years from the date of election and the term of office bearers shall be coterminous with the term of the board:Provided that the board may fill a casual vacancy on the board by nomination out of the same class of members in respect of which the casual vacancy has arisen, if the term of office of the board is less than half of its original term.","","(3) The Legislature of a State shall, by law, make provisions for co-option of persons to be members of the board having experience in the field of banking, management, finance or specialisation in any other field relating to the objects and activities undertaken by the co-operative society, as members of the board of such society:","","Provided that the number of such co-opted members shall not exceed two in addition to twenty-one directors specified in the first proviso to clause (1):","","Provided further that such co-opted members shall not have the right to vote in any election of the cooperative society in their capacity as such member or to be eligible to be elected as office bearers of the board:","","Provided also that the functional directors of a co-operative society shall also be the members of the board and such members shall be excluded for the purpose of counting the total number of directors specified in the first proviso to clause (1)."]],["243ZK","Election of members of board","IXB",["(1) Notwithstanding anything contained in any law made by the Legislature of a State, the election of a board shall be conducted before the expiry of the term of the board so as to ensure that the newly elected members of the board assume office immediately on the expiry of the term of the office of members of the outgoing board.","","(2) The superintendence, direction and control of the preparation of electoral rolls for, and the conduct of, all elections to a co-operative society shall vest in such an authority or body, as may be provided by the Legislature of a State, by law:","","Provided that the Legislature of a State may, by law, provide for the procedure and guidelines for the conduct of such elections."]],["243ZL","Supersession and suspension of board and interim management","IXB",["(1) Notwithstanding anything contained in any law for the time being in force, no board shall be superseded or kept under supersession for a period exceeding six months:","","Provided that the board may be superseded or kept under suspension in a case—","","(i) of its persistent default; or","","(ii) of negligence in the performance of its duties; or","","(iii) the board has committed any act prejudicial to the interests of the co-operative society or its members; or","","(iv) there is stalemate in the constitution or functions of the board; or (v) the authority or body as provided by the Legislature of a State, by law, under clause (2) of article 243ZK, has failed to conduct elections in accordance with the provisions of the State Act:","","Provided further that the board of any such co-operative society shall not be superseded or kept under suspension where there is no Government shareholding or loan or financial assistance or any guarantee by the Government:","","Provided also that in case of a co-operative society carrying on the business of banking, the provisions of the Banking Regulation Act, 1949 shall also apply:","","Provided also that in case of a co-operative society, other than a multi- State co-operative society, carrying on the business of banking, the provisions of this clause shall have the effect as if for the words ―six months‖, the words \"one year\" had been substituted.","","(2) In case of supersession of a board, the administrator appointed to manage the affairs of such cooperative society shall arrange for conduct of elections within the period specified in clause (1) and hand over the management to the elected board.","","(3) The Legislature of a State may, by law, make provisions for the conditions of service of the administrator."]],["243ZM","Audit of accounts of co-operative societies","IXB",["(1) The Legislature of a State may, by law, make provisions with respect to the maintenance of accounts by the co-operative societies and the auditing of such accounts at least once in each financial year.","","(2) The Legislature of a State shall, by law, lay down the minimum qualifications and experience of auditors and auditing firms that shall be eligible for auditing accounts of the co-operative societies.","","(3) Every co-operative society shall cause to be audited by an auditor or auditing firms referred to in clause (2) appointed by the general body of the co-operative society:","","Provided that such auditors or auditing firms shall be appointed from a panel approved by a State Government or an authority authorised by the State Government in this behalf.","","(4) The accounts of every co-operative society shall be audited within six months of the close of the financial year to which such accounts relate.","","(5) The audit report of the accounts of an apex co-operative society, as may be defined by the State Act, shall be laid before the State Legislature in the manner, as may be provided by the State Legislature, by law."]],["243ZN","Convening of general body meetings","IXB",["The Legislature of a State may, by law, make provisions that the annual general body meeting of every co-operative society shall be convened within a period of six months of close of the financial year to transact the business as may be provided in such law."]],["243ZO","Right of a member to get information","IXB",["(1) The Legislature of a State may, by law, provide for access to every member of a co-operative society to the books, information and accounts of the cooperative society kept in regular transaction of its business with such members.","","(2) The Legislature of a State may, by law, make provisions to ensure the participation of members of the management of the co-operative society providing minimum requirement of attending meetings by the members and utilising the minimum level of services as may be provided in such law.","","(3) The Legislature of a State may, by law, provide for co-operative education and training for its members."]],["243ZP","Returns","IXB",["(1) Every co-operative society shall file returns, within six months of the close of every financial year, to the authority designated by the State Government including the following matters, namely:—","","(a) annual report of its activities;","","(b) its audited statement of accounts;","","(c) plan for surplus disposal as approved by the general body of the co-operative society;","","(d) list of amendments to the bye-laws of the co-operative society, if any; (e) declaration regarding date of holding of its general body meeting and conduct of elections when due; and","","(f) any other information required by the Registrar in pursuance of any of the provisions of the State Act."]],["243ZQ","Offences and Penalties","IXB",["(1) The Legislature of a State may, by law, make provisions for the offences relating to the co-operative societies and penalties for such offences.","","(2) A law made by the Legislature of a State under clause (1) shall include the commission of the following act or omission as offences, namely:-","","(a) a co-operative society or an officer or member thereof wilfully makes a false return or furnishes false information, or any person wilfully not furnishes any information required from him by a person authorised in this behalf under the provisions of the State Act;","","(b) any person wilfully or without any reasonable excuse disobeys any summons, requisition or lawful written order issued under the provisions of the State Act;","","(c) any employer who, without sufficient cause, fails to pay to a co-operative society amount deducted by him from its employee within a period of fourteen days from the date on which such deduction is made;","","(d) any officer or custodian who wilfully fails to handover custody of books, accounts, documents, records, cash, security and other property belonging to a co-operative society of which he is an officer or custodian, to an authorised person; and","","(e) whoever, before, during or after the election of members of the board or office bearers, adopts any corrupt practice."]],["243ZR","Application to multi-State co-operative societies","IXB",["The provisions of this Part shall apply to the multi-State co-operative societies subject to the modification that any reference to \"Legislature of a State\", \"State Act\" or State Government\" shall be construed as a reference to \"Parliament\", \"Central Act\" or \"the Central Government\" respectively."]],["243ZS","Application to Union territories","IXB",["The provisions of this Part shall apply to the Union territories and shall, in their application to a Union territory, having no Legislative Assembly as if the references to the Legislature of a State were a reference to the administrator thereof appointed under article 239 and, in relation to a Union territory having a Legislative Assembly, to that Legislative Assembly:","","Provided that the President may, by notification in the Official Gazette, direct that the provisions of this Part shall not apply to any Union territory or part thereof as he may specify in the notification."]],["243ZT","Continuance of existing laws","IXB",["Notwithstanding anything in this Part, any provision of any law relating to co-operative societies in force in a State immediately before the commencement of the Constitution (Ninety-seventh Amendment) Act, 2011, which is inconsistent with the provisions of this Part, shall continue to be in force until amended or repealed by a competent Legislature or other competent authority or until the expiration of one year from such commencement, whichever is less."]],["244","Administration of Scheduled Areas and Tribal Areas","X",["(1) The provisions of the Fifth Schedule shall apply to the administration and control of the Scheduled Areas and Scheduled Tribes in any State other than the States of Assam, Meghalaya, Tripura and Mizoram.","","(2) The provisions of the Sixth Schedule shall apply to the administration of the tribal areas in the States of Assam Meghalaya, Tripura and Mizoram."]],["244A","Formation of an autonomous State comprising certain tribal areas in Assam and creation of local Legislature or Council of Ministers or both therefor","X",["(1) Notwithstanding anything in this Constitution, Parliament may, by law, form within the State of Assam an autonomous State (comprising whether wholly or in part) all or any of the tribal areas specified in Part I of the table appended to paragraph 20 of the Sixth Schedule and create therefor —","","(a) a body, whether elected or partly nominated and partly elected, to function as a Legislature for the autonomous State, or","","(b) a Council of Ministers,","","or both with such constitution, powers and functions, in each case, as may be specified in the law.","","(2) Any such law as is referred to in clause (1) may, in particular, —","","(a) specify the matters enumerated in the State List or the Concurrent List with respect to which the Legislature of the autonomous State shall have power to make laws for the whole or any part thereof, whether to the exclusion of the Legislature of the State of Assam or otherwise;","","(b) define the matters with respect to which the executive power of the autonomous State shall extend;","","(c) provide that any tax levied by the State of Assam shall be assigned to the autonomous State in so far as the proceeds thereof are attributable to the autonomous State;","","(d) provide that any reference to a State in any article of this Constitution shall be construed as including a reference to the autonomous State; and","","(e) make such supplemental, incidental and consequential provisions as may be deemed necessary.","","(3) An amendment of any such law as aforesaid in so far as such amendment relates to any of the matters specified in sub-clause (a) or sub-clause (b) of clause (2) shall have no effect unless the amendment is passed in each House of Parliament by not less than two-thirds of the members present and voting.","","(4) Any such law as is referred to in this article shall not be deemed to be an amendment of this Constitution for the purposes of article 368 notwithstanding that it contains any provision which amends or has the effect of amending this Constitution."]],["245","Extent of laws made by Parliament and by the Legislatures of States","XI",["(1) Subject to the provisions of this Constitution, Parliament may make laws for the whole or any part of the territory of India, and the Legislature of a State may make laws for the whole or any part of the State.","","(2) No law made by Parliament shall be deemed to be invalid on the ground that it would have extra-territorial operation."]],["246","Subject-matter of laws made by Parliament and by the Legislatures of States","XI",["(1) Notwithstanding anything in clauses (2) and (3), Parliament has exclusive power to make laws with respect to any of the matters enumerated in List I in the Seventh Schedule (in this Constitution referred to as the “Union List”).","","(2) Notwithstanding anything in clause (3), Parliament, and, subject to clause (1), the Legislature of any State also, have power to make laws with respect to any of the matters enumerated in List III in the Seventh Schedule (in this Constitution referred to as the “Concurrent List”).","","(3) Subject to clauses (1) and (2), the Legislature of any State has exclusive power to make laws for such State or any part thereof with respect to any of the matters enumerated in List II in the Seventh Schedule (in this Constitution referred to as the “State List”).","","(4) Parliament has power to make laws with respect to any matter for any part of the territory of India not included in a State notwithstanding that such matter is a matter enumerated in the State List."]],["246A","Special provision with respect to goods and services tax","XI",["(1) Notwithstanding anything contained in articles 246 and 254, Parliament, and, subject to clause (2), the Legislature of every State, have power to make laws with respect to goods and services tax imposed by the Union or by such State.","","(2) Parliament has exclusive power to make laws with respect to goods and services tax where the supply of goods, or of services, or both takes place in the course of inter-State trade or commerce.","","Explanation.—The provisions of this article shall, in respect of goods and services tax referred to in clause (5) of article 279A, take effect from the date recommended by the Goods and Services Tax Council."]],["247","Power of Parliament to provide for the establishment of certain additional courts","XI",["Notwithstanding anything in this Chapter, Parliament may by law provide for the establishment of any additional courts for the better administration of laws made by Parliament or of any existing laws with respect to a matter enumerated in the Union List."]],["248","Residuary powers of legislation","XI",["(1) Subject to article 246A, Parliament has exclusive power to make any law with respect to any matter not enumerated in the Concurrent List or State List.","","(2) Such power shall include the power of making any law imposing a tax not mentioned in either of those Lists."]],["249","Power of Parliament to legislate with respect to a matter in the State List in the national interest","XI",["(1) Notwithstanding anything in the foregoing provisions of this Chapter, if the Council of States has declared by resolution supported by not less than two-thirds of the members present and voting that it is necessary or expedient in the national interest that Parliament should make laws with respect to goods and services tax provided under article 246A or any matter enumerated in the State List specified in the resolution, it shall be lawful for Parliament to make laws for the whole or any part of the territory of India with respect to that matter while the resolution remains in force.","","(2) A resolution passed under clause (1) shall remain in force for such period not exceeding one year as may be specified therein.","","(3) A resolution passed under clause (1) may be renewed from time to time by a resolution passed in the like manner for a further period not exceeding one year at a time.","","(4) A law made by Parliament which Parliament would not but for the passing of a resolution under clause (1) have been competent to make shall, to the extent of the incompetency, cease to have effect on the expiration of a period of six months after the resolution has ceased to be in force, except as respects things done or omitted to be done before the expiration of the said period."]],["250","Power of Parliament to legislate with respect to any matter in the State List if a Proclamation of Emergency is in operation","XI",["(1) Notwithstanding anything in this Chapter, Parliament shall, while a Proclamation of Emergency is in operation, have power to make laws for the whole or any part of the territory of India with respect to goods and services tax provided under article 246A or any of the matters enumerated in the State List.","","(2) A law made by Parliament which Parliament would not but for the issue of a Proclamation of Emergency have been competent to make shall, to the extent of the incompetency, cease to have effect on the expiration of a period of six months after the Proclamation has ceased to operate, except as respects things done or omitted to be done before the expiration of the said period."]],["251","Inconsistency between laws made by Parliament under articles 249 and 250 and laws made by the Legislatures of States","XI",["Nothing in articles 249 and 250 shall restrict the power of the Legislature of a State to make any law which under this Constitution it has power to make, but if any provision of a law made by the Legislature of a State is repugnant to any provision of a law made by Parliament which Parliament has under either of the said articles power to make, the law made by Parliament, whether passed before or after the law made by the Legislature of the State, shall prevail, and the law made by the Legislature of the State shall to the extent of the repugnancy, but so long only as the law made by Parliament continues to have effect, be inoperative."]],["252","Power of Parliament to legislate for two or more States by consent and adoption of such legislation by","XI",["(1) If it appears to the Legislatures of two or more States to be desirable that any of the matters with respect to which Parliament has no power to make laws for the States except as provided in articles 249 and 250 should be regulated in such States by Parliament by law, and if resolutions to that effect are passed by all the Houses of the Legislatures of those States, it shall be lawful for Parliament to pass an Act for regulating that matter accordingly, and any Act so passed shall apply to such States and to any other State by which it is adopted afterwards by resolution passed in that behalf by the House or, where there are two Houses, by each of the Houses of the Legislature of that State.","","(2) Any Act so passed by Parliament may be amended or repealed by an Act of Parliament passed or adopted in like manner but shall not, as respects any State to which it applies, be amended or repealed by an Act of the Legislature of that State."]],["253","Legislation for giving effect to international agreements","XI",["Notwithstanding anything in the foregoing provisions of this Chapter, Parliament has power to make any law for the whole or any part of the territory of India for implementing any treaty, agreement or convention with any other country or countries or any decision made at any international conference, association or other body"]],["254","Inconsistency between laws made by Parliament and laws made by the Legislatures of States","XI",["(1) If any provision of a law made by the Legislature of a State is repugnant to any provision of a law made by Parliament which Parliament is competent to enact, or to any provision of an existing law with respect to one of the matters enumerated in the Concurrent List, then, subject to the provisions of clause (2), the law made by Parliament, whether passed before or after the law made by the Legislature of such State, or, as the case may be, the existing law, shall prevail and the law made by the Legislature of the State shall, to the extent of the repugnancy, be void.","","(2) Where a law made by the Legislature of a State with respect to one of the matters enumerated in the Concurrent List contains any provision repugnant to the provisions of an earlier law made by Parliament or an existing law with respect to that matter, then, the law so made by the Legislature of such State shall, if it has been reserved for the consideration of the President and has received his assent, prevail in that State:","","Provided that nothing in this clause shall prevent Parliament from enacting at any time any law with respect to the same matter including a law adding to, amending, varying or repealing the law so made by the Legislature of the State."]],["255","Requirements as to recommendations and previous sanctions to be regarded as matters of procedure only","XI",["No Act of Parliament or of the Legislature of a State and no provision in any such Act, shall be invalid by reason only that some recommendation or previous sanction required by this Constitution was not given, if assent to that Act was given —","","(a) where the recommendation required was that of the Governor, either by the Governor or by the President;","","(b) where the recommendation required was that of the Rajpramukh, either by the Rajpramukh or by the President;","","(c) where the recommendation or previous sanction required was that of the President, by the President."]],["256","Obligation of States and the Union","XI",["The executive power of every State shall be so exercised as to ensure compliance with the laws made by Parliament and any existing laws which apply in that State, and the executive power of the Union shall extend to the giving of such directions to a State as may appear to the Government of India to be necessary for that purpose."]],["257","Control of the Union over States in certain cases","XI",["(1) The executive power of every State shall be so exercised as not to impede or prejudice the exercise of the executive power of the Union, and the executive power of the Union shall extend to the giving of such directions to a State as may appear to the Government of India to be necessary for that purpose.","","(2) The executive power of the Union shall also extend to the giving of directions to a State as to the construction and maintenance of means of communication declared in the direction to be of national or military importance:","","Provided that nothing in this clause shall be taken as restricting the power of Parliament to declare highways or waterways to be national highways or national waterways or the power of the Union with respect to the highways or waterways so declared or the power of the Union to construct and maintain means of communication as part of its functions with respect to naval, military and air force works.","","(3) The executive power of the Union shall also extend to the giving of directions to a State as to the measures to be taken for the protection of the railways within the State.","","(4) Where in carrying out any direction given to a State under clause (2) as to the construction or maintenance of any means of communication or under clause (3) as to the measures to be taken for the protection of any railway, costs have been incurred in excess of those which would have been incurred in the discharge of the normal duties of the State if such direction had not been given, there shall be paid by the Government of India to the State such sum as may be agreed, or, in default of agreement, as may be determined by an arbitrator appointed by the Chief Justice of India, in respect of the extra costs so incurred by the State."]],["258","Power of the Union to confer powers, etc, on States in certain cases","XI",["(1) Notwithstanding anything in this Constitution, the President may, with the consent of the Government of a State, entrust either conditionally or unconditionally to that Government or to its officers functions in relation to any matter to which the executive power of the Union extends.","","(2) A law made by Parliament which applies in any State may, notwithstanding that it relates to a matter with respect to which the Legislature of the State has no power to make laws, confer powers and impose duties, or authorise the conferring of powers and the imposition of duties, upon the State or officers and authorities thereof.","","(3) Where by virtue of this article powers and duties have been conferred or imposed upon a State or officers or authorities thereof, there shall be paid by the Government of India to the State such sum as may be agreed, or, in default of agreement, as may be determined by an arbitrator appointed by the Chief Justice of India, in respect of any extra costs of administration incurred by the State in connection with the exercise of those powers and duties."]],["258A","Power of the States to entrust functions to the Union","XI",["Notwithstanding anything in this Constitution, the Governor of a State may, with the consent of the Government of India, entrust either conditionally or unconditionally to that Government or to its officers functions in relation to any matter to which the executive power of the State extends."]],["260","Jurisdiction of the Union in relation to territories outside India","XI",["The Government of India may by agreement with the Government of any territory not being part of the territory of India undertake any executive, legislative or judicial functions vested in the Government of such territory, but every such agreement shall be subject to, and governed by, any law relating to the exercise of foreign jurisdiction for the time being in force."]],["261","Public acts, records and judicial proceedings","XI",["(1) Full faith and credit shall be given throughout the territory of India to public acts, records and judicial proceedings of the Union and of every State.","","(2) The manner in which and the conditions under which the acts, records and proceedings referred to in clause (1) shall be proved and the effect thereof determined shall be as provided by law made by Parliament.","","(3) Final judgments or orders delivered or passed by civil courts in any part of the territory of India shall be capable of execution anywhere within that territory according to law."]],["262","Adjudication of disputes relating to waters of interState rivers or river valleys","XI",["(1) Parliament may by law provide for the adjudication of any dispute or complaint with respect to the use, distribution or control of the waters of, or in, any inter-State river or river valley.","","(2) Notwithstanding anything in this Constitution, Parliament may by law provide that neither the Supreme Court nor any other court shall exercise jurisdiction in respect of any such dispute or complaint as is referred to in clause (1)."]],["263","Provisions with respect to an inter-State Council","XI",["If at any time it appears to the President that the public interests would be served by the establishment of a Council charged with the duty of —","","(a) inquiring into and advising upon disputes which may have arisen between States;","","(b) investigating and discussing subjects in which some or all of the States, or the Union and one or more of the States, have a common interest; or","","(c) making recommendations upon any such subject and, in particular, recommendations for the better co-ordination of policy and action with respect to that subject, it shall be lawful for the President by order to establish such a Council, and to define the nature of the duties to be performed by it and its organisation and procedure."]],["264","Interpretation","XII",["In this Part, “Finance Commission” means a Finance Commission constituted under article 280."]],["265","Taxes not to be imposed save by authority of law","XII",["No tax shall be levied or collected except by authority of law."]],["266","Consolidated Funds and public accounts of India and of the States","XII",["(1) Subject to the provisions of article 267 and to the provisions of this Chapter with respect to the assignment of the whole or part of the net proceeds of certain taxes and duties to States, all revenues received by the Government of India, all loans raised by that Government by the issue of treasury bills, loans or ways and means advances and all moneys received by that Government in repayment of loans shall form one consolidated fund to be entitled “the Consolidated Fund of India”, and all revenues received by the Government of a State, all loans raised by that Government by the issue of treasury bills, loans or ways and means advances and all moneys received by that Government in repayment of loans shall form one consolidated fund to be entitled “the Consolidated Fund of the State”.","","(2) All other public moneys received by or on behalf of the Government of India or the Government of a State shall be credited to the public account of India or the public account of the State, as the case may be.","","(3) No moneys out of the Consolidated Fund of India or the Consolidated Fund of a State shall be appropriated except in accordance with law and for the purposes and in the manner provided in this Constitution."]],["267","Contingency Fund","XII",["(1) Parliament may by law establish a Contingency Fund in the nature of an imprest to be entitled “the Contingency Fund of India” into which shall be paid from time to time such sums as may be determined by such law, and the said Fund shall be placed at the disposal of the President to enable advances to be made by him out of such Fund for the purposes of meeting unforeseen expenditure pending authorisation of such expenditure by Parliament by law under article 115 or article 116.","","(2) The Legislature of a State may by law establish a Contingency Fund in the nature of an imprest to be entitled “the Contingency Fund of the State” into which shall be paid from time to time such sums as may be determined by such law, and the said Fund shall be placed at the disposal of the Governor of the State to enable advances to be made by him out of such Fund for the purposes of meeting unforeseen expenditure pending authorisation of such expenditure by the Legislature of the State by law under article 205 or article 206."]],["268","Duties levied by the Union but collected and appropriated by the States","XII",["(1) Such stamp duties as are mentioned in the Union List shall be levied by the Government of India but shall be collected—","","(a) in the case where such duties are leviable within any Union territory, by the Government of India, and","","(b) in other cases, by the States within which such duties are respectively leviable.","","(2) The proceeds in any financial year of any such duty leviable within any State shall not form part of the Consolidated Fund of India, but shall be assigned to that State."]],["268A","Service tax levied by Union and collected and appropriated by the Union and the States","XII",["Omitted by Constitution (101st Amendment) Act"]],["269","Taxes levied and collected by the Union but assigned to the States","XII",["(1) Taxes on the sale or purchase of goods and taxes on the consignment of goods except as provided in article 269A shall be levied and collected by the Government of India but shall be assigned to the States in the manner provided in clause (2).","","(2) The net proceeds in any financial year of any such tax, except insofar as those proceeds represent proceeds attributable to Union territories, shall not form part of the Consolidated Fund of India, but shall be assigned to the States within which that tax is leviable in that year, and shall be distributed among those States in accordance with such principles of distribution as may be formulated by Parliament by law."]],["269A","Levy and collection of goods and services tax in course of inter-State trade or commerce","XII",["(1) Goods and services tax on supplies in the course of inter-State trade or commerce shall be levied and collected by the Government of India and such tax shall be apportioned between the Union and the States in the manner as may be provided by Parliament by law on the recommendations of the Goods and Services Tax Council.","","Explanation.—For the purposes of this clause, supply of goods, or of services, or both in the course of import into the territory of India shall be deemed to be supply of goods, or of services, or both in the course of inter-State trade or commerce.","","(2) The amount apportioned to a State under clause (1) shall not form part of the Consolidated Fund of India.","","(3) Where an amount collected as tax levied under clause (1) has been used for payment of the tax levied by the Union under article 246A, or the tax levied by a State under article 246A, such amount shall not form part of the Consolidated Fund of India.","","(4) Where an amount collected as tax levied by a State under article 246A has been used for payment of the tax levied under clause (1), such amount shall not form part of the Consolidated Fund of the State.","","(5) Parliament may, by law, formulate the principles for determining the place of supply, and when a supply of goods, or of services, or both takes place in the course of inter-State trade or commerce."]],["270","Taxes levied and distributed between the Union and the States","XII",["(1) All taxes and duties referred to in the Union List, except the duties and taxes referred to in articles 268, 269 and 269A, respectively, surcharge on taxes and duties referred to in article 271 and any cess levied for specific purposes under any law made by Parliament shall be levied and collected by the Government of India and shall be distributed between the Union and the States in the manner provided in clause (2).","","(2) Such percentage, as may be prescribed, of the net proceeds of any such tax or duty in any financial year as may be prescribed, shall not form part of the Consolidated Fund of India and shall be assigned to the States in the manner provided in clause (3).","","(3) In this article, 'prescribed' means—","","(i) until a Finance Commission has been constituted, prescribed by the President by order, and","","(ii) after a Finance Commission has been constituted, prescribed by the President by order after considering the recommendations of the Finance Commission.","","(4) The amount assigned to the States under clause (2) shall be distributed among the States in such manner and from such time as may be prescribed.","","(5) The net proceeds of the goods and services tax apportioned to a State under clause (1) of article 269A shall also be deemed to be assigned to that State under this article."]],["271","Surcharge on certain duties and taxes for purposes of the Union","XII",["Notwithstanding anything in articles 269 and 270, Parliament may at any time increase any of the duties or taxes referred to in those articles, except the goods and services tax under article 246A, by a surcharge for purposes of the Union and the whole proceeds of any such surcharge shall form part of the Consolidated Fund of India."]],["273","Grants in lieu of export duty on jute and jute products","XII",["(1) There shall be charged on the Consolidated Fund of India in each year as grants-in-aid of the revenues of the States of Assam, Bihar, Orissa and West Bengal, in lieu of assignment of any share of the net proceeds in each year of export duty on jute and jute products to those States, such sums as may be prescribed.","","(2) The sums so prescribed shall continue to be charged on the Consolidated Fund of India so long as any export duty on jute or jute products continues to be levied by the Government of India or until the expiration of ten years from the commencement of this Constitution whichever is earlier.","","(3) In this article, the expression “prescribed” has the same meaning as in article 270."]],["274","Prior recommendation of President required to Bills affecting taxation in which States are interested","XII",["(1) No Bill or amendment which imposes or varies any tax or duty in which States are interested, or which varies the meaning of the expression “agricultural income” as defined for the purposes of the enactments relating to Indian income-tax, or which affects the principles on which under any of the foregoing provisions of this Chapter moneys are or may be distributable to States, or which imposes any such surcharge for the purposes of the Union as is mentioned in the foregoing provisions of this Chapter, shall be introduced or moved in either House of Parliament except on the recommendation of the President.","","(2) In this article, the expression “tax or duty in which States are interested” means —","","(a) a tax or duty the whole or part of the net proceeds whereof are assigned to any State; or","","(b) a tax or duty by reference to the net proceeds whereof sums are for the time being payable out of the Consolidated Fund of India to any State."]],["275","Grants from the Union to certain States","XII",["(1) Such sums as Parliament may by law provide shall be charged on the Consolidated Fund of India in each year as grants-in-aid of the revenues of such States as Parliament may determine to be in need of assistance, and different sums may be fixed for different States:","","Provided that there shall be paid out of the Consolidated Fund of India as grants-in-aid of the revenues of a State such capital and recurring sums as may be necessary to enable that State to meet the costs of such schemes of development as may be undertaken by the State with the approval of the Government of India for the purpose of promoting the welfare of the Scheduled Tribes in that State or raising the level of administration of the Scheduled Areas therein to that of the administration of the rest of the areas of that State:","","Provided further that there shall be paid out of the Consolidated Fund of India as grants-in-aid of the revenues of the State of Assam sums, capital and recurring, equivalent to —","","(a) the average excess of expenditure over the revenues during the two years immediately preceding the commencement of this Constitution in respect of the administration of the tribal areas specified in Part I of the table appended to paragraph 20 of the Sixth Schedule; and","","(b) the costs of such schemes of development as may be undertaken by that State with the approval of the Government of India for the purpose of raising the level of administration of the said areas to that of the administration of the rest of the areas of that State.","","(1A) On and from the formation of the autonomous State under article 244A, —","","(i) any sums payable under clause (a) of the second proviso to clause (1) shall, if the autonomous State comprises all the tribal areas referred to therein, be paid to the autonomous State, and, if the autonomous State comprises only some of those tribal areas, be apportioned between the State of Assam and the autonomous State as the President may, by order, specify;","","","(ii) there shall be paid out of the Consolidated Fund of India as grants-in-aid of the revenues of the autonomous State sums, capital and recurring, equivalent to the costs of such schemes of development as may be undertaken by the autonomous State with the approval of the Government of India for the purpose of raising the level of administration of that State to that of the administration of the rest of the State of Assam.","","(2) Until provision is made by Parliament under clause (1), the powers conferred on Parliament under that clause shall be exercisable by the President by order and any order made by the President under this clause shall have effect subject to any provision so made by Parliament:","","Provided that after a Finance Commission has been constituted no order shall be made under this clause by the President except after considering the recommendations of the Finance Commission."]],["276","Taxes on professions, trades, callings and employments","XII",["(1) Notwithstanding anything in article 246, no law of the Legislature of a State relating to taxes for the benefit of the State or of a municipality, district board, local board or other local authority therein in respect of professions, trades, callings or employments shall be invalid on the ground that it relates to a tax on income.","","(2) The total amount payable in respect of any one person to the State or to any one municipality, district board, local board or other local authority in the State by way of taxes on professions, trades, callings and employments shall not exceed 1 [two thousand and five hundred rupees] per annum.","","(3) The power of the Legislature of a State to make laws as aforesaid with respect to taxes on professions, trades, callings and employments shall not be construed as limiting in any way the power of Parliament to make laws with respect to taxes on income accruing from or arising out of professions, trades, callings and employments."]],["277","Savings","XII",["Any taxes, duties, cesses or fees which, immediately before the commencement of this Constitution, were being lawfully levied by the Government of any State or by any municipality or other local authority or body for the purposes of the State, municipality, district or other local area may, notwithstanding that those taxes, duties, cesses or fees are mentioned in the Union List, continue to be levied and to be applied to the same purposes until provision to the contrary is made by Parliament by law."]],["279","Calculation of “net proceeds”, etc","XII",["(1) In the foregoing provisions of this Chapter, “net proceeds” means in relation to any tax or duty the proceeds thereof reduced by the cost of collection, and for the purposes of those provisions the net proceeds of any tax or duty, or of any part of any tax or duty, in or attributable to any area shall be ascertained and certified by the Comptroller and Auditor-General of India, whose certificate shall be final.","","(2) Subject as aforesaid, and to any other express provision of this Chapter, a law made by Parliament or an order of the President may, in any case where under this Part the proceeds of any duty or tax are, or may be, assigned to any State, provide for the manner in which the proceeds are to be calculated, for the time from or at which and the manner in which any payments are to be made, for the making of adjustments between one financial year and another, and for any other incidental or ancillary matters."]],["279A","Goods and Services Tax Council","XII",["(1) The President shall, within sixty days from the date of commencement of the Constitution (One Hundred and First Amendment) Act, 2016, by order, constitute a Council to be called the Goods and Services Tax Council.","","(2) The Goods and Services Tax Council shall consist of the following members, namely:—","","(a) the Union Finance Minister—Chairperson;","(b) the Union Minister of State in charge of Revenue or Finance—Member;","(c) the Minister in charge of Finance or Taxation or any other Minister nominated by each State Government—Members.","","(3) The Members of the Goods and Services Tax Council referred to in sub-clause (c) of clause (2) shall, as soon as may be, choose one amongst themselves to be the Vice-Chairperson of the Council for such period as they may decide.","","(4) The Goods and Services Tax Council shall make recommendations to the Union and the States on—","","(a) the taxes, cesses and surcharges levied by the Union, the States and the local bodies which may be subsumed in the goods and services tax;","(b) the goods and services that may be subjected to, or exempted from the goods and services tax;","(c) model Goods and Services Tax Laws, principles of levy, apportionment of Goods and Services Tax levied on supplies in the course of inter-State trade or commerce under article 269A and the principles that govern the place of supply;","(d) the threshold limit of turnover below which goods and services may be exempted from goods and services tax;","(e) the rates including floor rates with bands of goods and services tax;","(f) any special rate or rates for a specified period, to raise additional resources during any natural calamity or disaster;","(g) special provision with respect to the States of Arunachal Pradesh, Assam, Jammu and Kashmir, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura, Himachal Pradesh and Uttarakhand; and","(h) any other matter relating to the goods and services tax, as the Council may decide.","","(5) The Goods and Services Tax Council shall recommend the date on which the goods and services tax be levied on petroleum crude, high speed diesel, motor spirit (commonly known as petrol), natural gas and aviation turbine fuel.","","(6) While discharging the functions conferred by this article, the Goods and Services Tax Council shall be guided by the need for a harmonised structure of goods and services tax and for the development of a harmonised national market for goods and services.","","(7) One-half of the total number of Members of the Goods and Services Tax Council shall constitute the quorum at its meetings.","","(8) The Goods and Services Tax Council shall determine the procedure in the performance of its functions.","","(9) Every decision of the Goods and Services Tax Council shall be taken at a meeting, by a majority of not less than three-fourths of the weighted votes of the members present and voting, in accordance with the following principles, namely:—","","(a) the vote of the Central Government shall have a weightage of one-third of the total votes cast, and","(b) the votes of all the State Governments taken together shall have a weightage of two-thirds of the total votes cast.","","(10) No act or proceedings of the Goods and Services Tax Council shall be invalid merely by reason of—","","(a) any vacancy in, or any defect in, the constitution of the Council; or","(b) any defect in the appointment of a person as a Member of the Council; or","(c) any procedural irregularity of the Council not affecting the merits of the case.","","(11) The Goods and Services Tax Council shall establish a mechanism to adjudicate any dispute—","","(a) between the Government of India and one or more States; or","(b) between the Government of India and any State or States on one side and one or more other States on the other side; or","(c) between two or more States,","","arising out of the recommendations of the Council or implementation there
